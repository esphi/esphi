<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Emre Yıldırım">
<style>
.ad{font:700 42px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1f2328;letter-spacing:-0.5px}
.alt{font:500 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#59636e}
.n{font:600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1f2328;text-anchor:middle;dominant-baseline:central}
